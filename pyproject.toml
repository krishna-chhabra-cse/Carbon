[project]
name = "carbon"
version = "2.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["apps/Carbon Agent Service"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "S"]
ignore = ["S101"]  # Allow assert in tests

[tool.ruff.lint.per-file-ignores]
# Standalone manual test scripts: load .env before importing agent modules; long inline fixture strings.
"apps/Carbon Agent Service/test_*.py" = ["E402", "E501"]
# urllib calls hit the configured Ollama endpoint and fixed https LLM APIs only.
"apps/Carbon Agent Service/tools/llm_client.py" = ["S310"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
