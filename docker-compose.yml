version: '3.8'

services:
  # ── 1. Python Agent Service (FastAPI + LangGraph + Gemini) ────
  agent-service:
    build:
      context: ./"apps/Carbon Agent Service"
      dockerfile: Dockerfile
    container_name: carbon-agent-service
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── 2. Node.js Backend Proxy (Express + Video Explainer Engine)
  backend:
    build:
      context: ./"apps/Carbon Backend"
      dockerfile: Dockerfile
    container_name: carbon-backend
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - PYTHON_SERVICE_URL=http://agent-service:8000
    depends_on:
      agent-service:
        condition: service_healthy
    restart: unless-stopped

  # ── 3. React Frontend Studio (SPA + NGINX) ────────────────────
  frontend:
    build:
      context: ./"apps/Carbon Frontend"
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3002
    container_name: carbon-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
