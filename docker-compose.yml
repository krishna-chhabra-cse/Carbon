version: '3.8'

services:
  # ── 1. Python Agent Service (FastAPI + LangGraph + Gemini) ────
  agent-service:
    build:
      context: ./"apps/Carbon Agent Service"
      dockerfile: Dockerfile
    container_name: carbon-agent-service
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://carbon:${DB_PASSWORD:-carbon123}@postgres:5432/carbon
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── 2. Node.js Backend Proxy (Express + Video Explainer Engine)
  backend:
    build:
      context: ./"apps/Carbon Backend"
      dockerfile: Dockerfile
    container_name: carbon-backend
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - PYTHON_SERVICE_URL=http://agent-service:8000
    depends_on:
      agent-service:
        condition: service_healthy
    restart: unless-stopped

  # ── 3. React Frontend Studio (SPA + NGINX) ────────────────────
  frontend:
    build:
      context: ./"apps/Carbon Frontend"
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3002
    container_name: carbon-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── New Infrastructure Services ──────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: carbon-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: carbon-postgres
    environment:
      POSTGRES_DB: carbon
      POSTGRES_USER: carbon
      POSTGRES_PASSWORD: ${DB_PASSWORD:-carbon123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbon"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
